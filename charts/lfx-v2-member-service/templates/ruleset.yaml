    - id: "rule:lfx:lfx-v2-member-service:b2b_orgs:get-settings"
      allow_encoded_slashes: 'off'
      match:
        methods:
          - GET
        routes:
          - path: /b2b_orgs/:uid/settings
      # Gated by auditor (not writer) so that existing writers and auditors can see
      # the full principal list, including pending-invite email addresses. This is
      # intentional — auditors are trusted principals who need visibility into who
      # has access in order to manage invitations.
      #
      # The premise above no longer holds: auditor is not only an explicit per-org
      # grant. team:lf-staff#member and team:lf-contractor#member hold auditor on
      # every b2b_org, so once those grants are backfilled this route exposes
      # pending-invite email addresses to all LF staff and contractors rather than
      # to principals granted on this specific org. The b2b_org_settings search
      # document carries the same auditor access check, so tightening this route
      # alone would leave the roster reachable through search.
      #
      # The gate is deliberately unchanged here — narrowing it would also remove
      # roster read from per-org auditors who have it today, which is a product
      # decision, not a side effect of the grants. Tracked in LFXV2-3037, which
      # blocks the prod backfill.
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        {{- if .Values.openfga.enabled }}
        - authorizer: openfga_check
          config:
            values:
              relation: auditor
              object: "b2b_org:{{ "{{- .Request.URL.Captures.uid -}}" }}"
        {{- else }}
        {{/*
          When OpenFGA is disabled, allow all requests.
          (Only meant for *local development* because OpenFGA should be enabled when deployed.)
        */}}
        - authorizer: allow_all
        {{- end }}
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}

