---
{{- if .Values.nats.kv_bucket_cache.creation }}
apiVersion: jetstream.nats.io/v1beta2
kind: KeyValue
metadata:
  name: {{ .Values.nats.kv_bucket_cache.name }}
  namespace: lfx
  {{- if .Values.nats.kv_bucket_cache.keep }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  bucket: {{ .Values.nats.kv_bucket_cache.name }}
  replicas: {{ .Values.nats.kv_bucket_cache.replicas }}
  history: {{ .Values.nats.kv_bucket_cache.history }}
  storage: {{ .Values.nats.kv_bucket_cache.storage }}
  maxValueSize: {{ .Values.nats.kv_bucket_cache.maxValueSize }}
  maxBytes: {{ .Values.nats.kv_bucket_cache.maxBytes }}
  compression: {{ .Values.nats.kv_bucket_cache.compression }}
  ttl: {{ .Values.nats.kv_bucket_cache.ttl }}
{{- end }}
---
{{- if .Values.nats.kv_bucket_org_settings.creation }}
apiVersion: jetstream.nats.io/v1beta2
kind: KeyValue
metadata:
  name: {{ .Values.nats.kv_bucket_org_settings.name }}
  namespace: lfx
  {{- if .Values.nats.kv_bucket_org_settings.keep }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  bucket: {{ .Values.nats.kv_bucket_org_settings.name }}
  replicas: {{ .Values.nats.kv_bucket_org_settings.replicas }}
  history: {{ .Values.nats.kv_bucket_org_settings.history }}
  storage: {{ .Values.nats.kv_bucket_org_settings.storage }}
  maxValueSize: {{ .Values.nats.kv_bucket_org_settings.maxValueSize }}
  maxBytes: {{ .Values.nats.kv_bucket_org_settings.maxBytes }}
  compression: {{ .Values.nats.kv_bucket_org_settings.compression }}
  # IMPORTANT: do not set ttl in production — this bucket holds authoritative
  # access-control state. TTL eviction silently revokes all org writers/auditors
  # with no audit trail. Only enable for local-dev bucket teardown.
  {{- if .Values.nats.kv_bucket_org_settings.ttl }}
  ttl: {{ .Values.nats.kv_bucket_org_settings.ttl }}
  {{- end }}
{{- end }}
---
{{- if .Values.nats.kv_bucket_org_workspaces.creation }}
apiVersion: jetstream.nats.io/v1beta2
kind: KeyValue
metadata:
  name: {{ .Values.nats.kv_bucket_org_workspaces.name }}
  namespace: lfx
  {{- if .Values.nats.kv_bucket_org_workspaces.keep }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  bucket: {{ .Values.nats.kv_bucket_org_workspaces.name }}
  replicas: {{ .Values.nats.kv_bucket_org_workspaces.replicas }}
  history: {{ .Values.nats.kv_bucket_org_workspaces.history }}
  storage: {{ .Values.nats.kv_bucket_org_workspaces.storage }}
  maxValueSize: {{ .Values.nats.kv_bucket_org_workspaces.maxValueSize }}
  maxBytes: {{ .Values.nats.kv_bucket_org_workspaces.maxBytes }}
  compression: {{ .Values.nats.kv_bucket_org_workspaces.compression }}
  # IMPORTANT: do not set ttl in production — this bucket holds authoritative
  # workspace state. TTL eviction would silently delete all org workspace data
  # with no audit trail. Only enable for local-dev bucket teardown.
  {{- if .Values.nats.kv_bucket_org_workspaces.ttl }}
  ttl: {{ .Values.nats.kv_bucket_org_workspaces.ttl }}
  {{- end }}
{{- end }}
---
{{- if .Values.nats.kv_bucket_org_workspace_projects.creation }}
apiVersion: jetstream.nats.io/v1beta2
kind: KeyValue
metadata:
  name: {{ .Values.nats.kv_bucket_org_workspace_projects.name }}
  namespace: lfx
  {{- if .Values.nats.kv_bucket_org_workspace_projects.keep }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  bucket: {{ .Values.nats.kv_bucket_org_workspace_projects.name }}
  replicas: {{ .Values.nats.kv_bucket_org_workspace_projects.replicas }}
  history: {{ .Values.nats.kv_bucket_org_workspace_projects.history }}
  storage: {{ .Values.nats.kv_bucket_org_workspace_projects.storage }}
  maxValueSize: {{ .Values.nats.kv_bucket_org_workspace_projects.maxValueSize }}
  maxBytes: {{ .Values.nats.kv_bucket_org_workspace_projects.maxBytes }}
  compression: {{ .Values.nats.kv_bucket_org_workspace_projects.compression }}
  # IMPORTANT: do not set ttl in production — this bucket holds authoritative
  # workspace-project association state. TTL eviction would silently delete all
  # per-workspace project data with no audit trail.
  {{- if .Values.nats.kv_bucket_org_workspace_projects.ttl }}
  ttl: {{ .Values.nats.kv_bucket_org_workspace_projects.ttl }}
  {{- end }}
{{- end }}
---
{{- if .Values.nats.kv_bucket_sobject_cache.creation }}
apiVersion: jetstream.nats.io/v1beta2
kind: KeyValue
metadata:
  name: {{ .Values.nats.kv_bucket_sobject_cache.name }}
  namespace: lfx
  {{- if .Values.nats.kv_bucket_sobject_cache.keep }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  bucket: {{ .Values.nats.kv_bucket_sobject_cache.name }}
  replicas: {{ .Values.nats.kv_bucket_sobject_cache.replicas }}
  history: {{ .Values.nats.kv_bucket_sobject_cache.history }}
  storage: {{ .Values.nats.kv_bucket_sobject_cache.storage }}
  maxValueSize: {{ .Values.nats.kv_bucket_sobject_cache.maxValueSize }}
  maxBytes: {{ .Values.nats.kv_bucket_sobject_cache.maxBytes }}
  compression: {{ .Values.nats.kv_bucket_sobject_cache.compression }}
  ttl: {{ .Values.nats.kv_bucket_sobject_cache.ttl }}
{{- end }}
---
{{- if .Values.nats.kv_bucket_pubsub_state.creation }}
apiVersion: jetstream.nats.io/v1beta2
kind: KeyValue
metadata:
  name: {{ .Values.nats.kv_bucket_pubsub_state.name }}
  namespace: lfx
  {{- if .Values.nats.kv_bucket_pubsub_state.keep }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  bucket: {{ .Values.nats.kv_bucket_pubsub_state.name }}
  replicas: {{ .Values.nats.kv_bucket_pubsub_state.replicas }}
  history: {{ .Values.nats.kv_bucket_pubsub_state.history }}
  storage: {{ .Values.nats.kv_bucket_pubsub_state.storage }}
  maxValueSize: {{ .Values.nats.kv_bucket_pubsub_state.maxValueSize }}
  maxBytes: {{ .Values.nats.kv_bucket_pubsub_state.maxBytes }}
  compression: {{ .Values.nats.kv_bucket_pubsub_state.compression }}
  # IMPORTANT: no ttl — replay cursors must survive indefinitely so the
  # consumer resumes from where it left off after a restart or pod eviction.
  # Losing this entry forces a full replay from the earliest retained event.
{{- end }}
---
{{- if .Values.nats.kv_bucket_cdc_repair.creation }}
apiVersion: jetstream.nats.io/v1beta2
kind: KeyValue
metadata:
  name: {{ .Values.nats.kv_bucket_cdc_repair.name }}
  namespace: lfx
  {{- if .Values.nats.kv_bucket_cdc_repair.keep }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  bucket: {{ .Values.nats.kv_bucket_cdc_repair.name }}
  replicas: {{ .Values.nats.kv_bucket_cdc_repair.replicas }}
  history: {{ .Values.nats.kv_bucket_cdc_repair.history }}
  storage: {{ .Values.nats.kv_bucket_cdc_repair.storage }}
  maxValueSize: {{ .Values.nats.kv_bucket_cdc_repair.maxValueSize }}
  maxBytes: {{ .Values.nats.kv_bucket_cdc_repair.maxBytes }}
  compression: {{ .Values.nats.kv_bucket_cdc_repair.compression }}
  # IMPORTANT: no ttl — a pending repair marker must never be silently evicted
  # before it is drained via POST /admin/reindex {cdc_repair:true}.
{{- end }}
