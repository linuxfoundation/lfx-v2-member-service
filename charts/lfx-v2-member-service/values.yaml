---
# image is the configuration for the container images
image:
  # repository is the container image repository
  repository: ghcr.io/linuxfoundation/lfx-v2-member-service/member-api
  # tag is the container image tag (overrides appVersion from Chart.yaml)
  tag: ""
  # pullPolicy is the image pull policy
  pullPolicy: IfNotPresent

# replicaCount is the number of replicas for the deployment
replicaCount: 3

# topologySpreadConstraints controls how pods are spread across nodes/zones.
topologySpreadConstraints: []

# resources is the configuration for container resource limits and requests
resources:
  # limits is the maximum amount of resources the container can use
  limits:
    cpu: 500m
    memory: 512Mi
  # requests is the amount of resources the container requests
  requests:
    cpu: 100m
    memory: 128Mi

# app is the configuration for the application
app:
  # logLevel is the log level (debug, info, warn, error)
  logLevel: info
  # logAddSource is a boolean to determine if the log source should be added
  logAddSource: true
  # audience is the JWT audience required for authentication with this app
  audience: lfx-v2-member-service
  # jwtAuthDisabledMockLocalPrincipal mocks auth for local development to use a set principal
  # (only use for local development)
  jwtAuthDisabledMockLocalPrincipal: ""
  # use_oidc_contextualizer is a boolean to determine if the OIDC contextualizer should be used
  use_oidc_contextualizer: true
  # globalOrgAdminTeamUID is the v2 UID of the platform org-admin team
  # whose members (EasyCLA / LFX Enrollment client-IDs) are authorized to
  # call POST /b2b_orgs and POST /admin/reindex. The placeholder _null
  # never matches a real team UID; override per-environment.
  globalOrgAdminTeamUID: "_null"
  # lfStaffTeamName is the LDAP-backed OpenFGA team granted blanket auditor
  # (read-only) access on every b2b_org. Unlike globalOrgAdminTeamUID this is a
  # team *name*, not a UID: it is the same in every environment, so it is a real
  # value here rather than a placeholder overridden per environment. This is the
  # single authoritative copy — nothing else in the repo hardcodes it.
  #
  # Deploying is the cutover. Every write path asserts the reference, so orgs
  # begin acquiring the tuple as CDC events arrive; the backfill scripts only
  # sweep up orgs that never change on their own. Plan the rollout knowing the
  # grant starts here, not at the backfill.
  #
  # Setting it to "" stops new grants being emitted. It does not revoke grants
  # already written: fga-sync never deletes a tuple whose subject begins with
  # "team:", so removal needs scripts/revoke-lf-teams-auditor-openfga.sh. That
  # guard is in the deployed fga-sync (added in v0.3.1; the platform chart
  # deploys ~0.3.5), not in this repo's go.mod pin, which only supplies message
  # types. See docs/lf-team-auditor-grants.md.
  #
  # Only an LF staff team belongs here. Contractors do not inherit staff access
  # — see LFXV2-3071. Because the grant is unreapable, a contractor key is
  # absent rather than present-and-blank: a deployment from stale values would
  # otherwise write tuples nothing can remove.
  lfStaffTeamName: "lf-staff"
  # lfxSelfServeBaseURL is the base URL injected as ReturnURL in org-settings invite emails.
  # Leave empty to omit the return link from the invite email.
  lfxSelfServeBaseURL: ""
  # adminReindexQuotaThreshold is the Salesforce API usage ratio (0,1] at or
  # above which POST /admin/reindex {cdc_repair:true} refuses to start a drain
  # (ServiceUnavailable). Leave empty to use the in-code default (0.80).
  adminReindexQuotaThreshold: ""
  # extraEnv is a list of additional environment variables to set in the container.
  # Supports both simple key-value pairs and Kubernetes field references.
  extraEnv: []
  # otel is the configuration for OpenTelemetry tracing
  otel:
    # serviceName is the service name for OpenTelemetry resource identification
    # (default: "lfx-v2-member-service")
    serviceName: ""
    # serviceVersion is the service version for OpenTelemetry resource identification
    # (default: "1.0.0")
    serviceVersion: ""
    # protocol specifies the OTLP protocol: "grpc" or "http"
    # (default: "grpc")
    protocol: "grpc"
    # endpoint is the OTLP collector endpoint
    # For gRPC: typically "host:4317", for HTTP: typically "host:4318"
    endpoint: ""
    # insecure disables TLS for the OTLP connection
    # Set to "true" for in-cluster communication without TLS
    insecure: "false"
    # tracesExporter specifies the traces exporter: "otlp" or "none"
    # (default: "none")
    tracesExporter: "none"
    # tracesSampler specifies the OTEL_TRACES_SAMPLER type. Supported values:
    # "always_on", "always_off", "traceidratio", "parentbased_always_on",
    # "parentbased_always_off", "parentbased_traceidratio".
    # When empty, the application defaults to parentbased_traceidratio.
    tracesSampler: ""
    # tracesSamplerArg specifies the OTEL_TRACES_SAMPLER_ARG (sampler ratio or parent_sampler_arg).
    # Used by "traceidratio" and "parentbased_traceidratio" samplers (defaults to 1.0 if empty).
    # (default: "")
    tracesSamplerArg: ""
    # metricsExporter specifies the metrics exporter: "otlp" or "none"
    # (default: "none")
    metricsExporter: "none"
    # logsExporter specifies the logs exporter: "otlp" or "none"
    # (default: "none")
    logsExporter: "none"
    # propagators specifies the propagators to use, comma-separated
    # Supported values: "tracecontext", "baggage", "jaeger"
    # (default: "tracecontext,baggage")
    propagators: "tracecontext,baggage,jaeger"

# traefik is the configuration for Traefik Gateway API routing
traefik:
  # gateway specifies the platform Gateway to attach to
  gateway:
    name: lfx-platform-gateway
    namespace: lfx

# lfx is the configuration for LFX platform
lfx:
  # domain is the base domain for routing
  domain: k8s.orb.local
  # namespace is the target namespace for deployment
  namespace: lfx

# service is the configuration for the Kubernetes service
service:
  # port is the service port
  port: 8080

# nats is the configuration for the NATS server
nats:
  # url is the URL of the NATS server
  url: nats://lfx-platform-nats.lfx.svc.cluster.local:4222

  # kv_bucket_cache is the configuration for the single membership-cache KV bucket.
  # All cached records (tiers, memberships, key contacts, project ID mappings) are
  # stored here with namespaced key prefixes to avoid collisions. The bucket-level
  # TTL enforces hard eviction; per-item soft TTLs (6h stale, 23h expire) are
  # written into each entry's CachedValue envelope by the service.
  kv_bucket_cache:
    # creation is a boolean to determine if the KV bucket should be created via the helm chart.
    # set it to false if you want to use an existing KV bucket.
    creation: true
    # keep is a boolean to determine if the KV bucket should be preserved during helm uninstall
    # set it to false if you want the bucket to be deleted when the chart is uninstalled
    keep: true
    # name is the name of the KV bucket
    name: membership-cache
    # replicas is the number of replicas for the KV bucket
    replicas: 1
    # history is the number of historical values to keep per key
    history: 1
    # storage is the storage type for the KV bucket
    storage: file
    # maxValueSize is the maximum size of a value in the KV bucket
    maxValueSize: 10485760 # 10MB
    # maxBytes is the maximum total size of the KV bucket
    maxBytes: 1073741824 # 1GB
    # compression is a boolean to determine if the KV bucket should be compressed
    compression: true
    # ttl is the bucket-level hard eviction TTL for all entries
    ttl: 24h

  # kv_bucket_org_settings is the configuration for the org-settings KV bucket.
  # Stores b2b_org access-control principals (writers, auditors, and pending
  # invites). This is authoritative state — no soft-TTL envelopes, no MaxAge
  # eviction. Pattern mirrors lfx-v2-committee-service "committee-settings" bucket.
  kv_bucket_org_settings:
    creation: true
    keep: true
    name: org-settings
    replicas: 1
    history: 20
    storage: file
    maxValueSize: 10485760 # 10MB
    maxBytes: 1073741824 # 1GB
    compression: true
    ttl: ""

  # kv_bucket_org_workspaces is the configuration for the org-workspaces KV bucket.
  # Stores org workspace documents (named groups of project associations). This is
  # authoritative state — no soft-TTL envelopes, no MaxAge eviction. Pattern mirrors
  # kv_bucket_org_settings (another authoritative-state bucket with no TTL).
  kv_bucket_org_workspaces:
    creation: true
    keep: true
    name: org-workspaces
    replicas: 1
    history: 20
    storage: file
    maxValueSize: 10485760 # 10MB
    maxBytes: 1073741824 # 1GB
    compression: true
    ttl: ""

  # kv_bucket_org_workspace_projects is the configuration for the org_workspace_projects KV bucket.
  # Stores per-workspace project association documents keyed by workspace UID. This is
  # authoritative state — no soft-TTL envelopes, no MaxAge eviction. Pattern mirrors
  # kv_bucket_org_workspaces (another authoritative-state bucket with no TTL).
  kv_bucket_org_workspace_projects:
    creation: true
    keep: true
    name: org_workspace_projects
    replicas: 1
    history: 20
    storage: file
    maxValueSize: 10485760 # 10MB
    maxBytes: 1073741824 # 1GB
    compression: true
    ttl: ""

  # kv_bucket_sobject_cache is the configuration for the member-service-cache KV
  # bucket. It stores raw Salesforce sObject REST API responses alongside their
  # ETag / Last-Modified metadata so the service can issue HTTP conditional GETs
  # (If-None-Match / If-Modified-Since) on subsequent fetches. Keys follow the
  # "{sobject_type}.{uid}" pattern. Unlike membership-cache this bucket does NOT
  # use soft-TTL envelopes — freshness is handled entirely by HTTP conditional
  # GET semantics. Entries are re-written (resetting the TTL) on every successful
  # 304 revalidation, so a 7-day TTL acts as a backstop for records that are
  # never modified and become quiet.
  kv_bucket_sobject_cache:
    # creation is a boolean to determine if the KV bucket should be created via the helm chart.
    # set it to false if you want to use an existing KV bucket.
    creation: true
    # keep is a boolean to determine if the KV bucket should be preserved during helm uninstall
    # set it to false if you want the bucket to be deleted when the chart is uninstalled
    keep: true
    # name is the name of the KV bucket
    name: member-service-cache
    # replicas is the number of replicas for the KV bucket
    replicas: 1
    # history is the number of historical values to keep per key
    history: 1
    # storage is the storage type for the KV bucket
    storage: file
    # maxValueSize is the maximum size of a value in the KV bucket (10 MB)
    maxValueSize: 10485760
    # maxBytes is the maximum total size of the KV bucket (1 GB)
    maxBytes: 1073741824
    # compression enables NATS JetStream compression for stored values
    compression: true
    # ttl is the bucket-level hard eviction TTL for all entries (7 days)
    ttl: 168h

  # kv_bucket_pubsub_state is the configuration for the pubsub-state KV bucket.
  # Stores the Salesforce Pub/Sub replay ID (opaque cursor) so the CDC consumer
  # can resume from its last processed event after a restart or pod eviction.
  # No MaxAge TTL — replay cursors must survive indefinitely. Pattern mirrors
  # kv_bucket_org_settings (another authoritative-state bucket with no TTL).
  kv_bucket_pubsub_state:
    # creation is a boolean to determine if the KV bucket should be created via the helm chart.
    # set it to false if you want to use an existing KV bucket.
    creation: true
    # keep is a boolean to determine if the KV bucket should be preserved during helm uninstall.
    # set it to false if you want the bucket to be deleted when the chart is uninstalled.
    # WARNING: losing this bucket forces a full replay from the earliest retained
    # Salesforce event, which can generate a large indexer/FGA backlog.
    keep: true
    # name is the name of the KV bucket
    name: pubsub-state
    # replicas is the number of replicas for the KV bucket
    replicas: 1
    # history is the number of historical values to keep per key (one key per CDC channel)
    history: 5
    # storage is the storage type for the KV bucket
    storage: file
    # maxValueSize is the maximum size of a value in the KV bucket (64 KB — replay IDs are small blobs)
    maxValueSize: 65536
    # maxBytes is the maximum total size of the KV bucket (10 MB)
    maxBytes: 10485760
    # compression is a boolean to determine if the KV bucket should be compressed
    compression: true

  # kv_bucket_cdc_repair is the configuration for the cdc-repair KV bucket.
  # Holds durable pending markers for CDC upserts skipped due to Salesforce API
  # quota exhaustion, keyed "pending.{reindex_type}.{sfid}", drained via
  # POST /admin/reindex {cdc_repair:true}. No MaxAge TTL — a pending marker must
  # never be silently evicted before it is drained. History is 1 (a pending set —
  # old marker revisions are never needed, only the current revision for
  # conditional deletes). Pattern mirrors kv_bucket_pubsub_state (another
  # authoritative-state bucket with no TTL).
  kv_bucket_cdc_repair:
    creation: true
    keep: true
    name: cdc-repair
    replicas: 1
    history: 1
    storage: file
    maxValueSize: 10485760 # 10MB
    maxBytes: 1073741824 # 1GB
    compression: true

  # kv_bucket_key_contact_grants is the configuration for the key-contact-grants
  # KV bucket. Records the FGA key_contact grant published per key contact, keyed
  # "key_contact.{sfid}" with a {membership_uid, username} value, so a CDC delete
  # (which carries only the key contact's own SFID, after the Salesforce record is
  # already gone) can still build a correctly addressed member_remove. No MaxAge
  # TTL — a key contact may live for years before deletion and an evicted entry
  # cannot be rebuilt from any other source, so eviction means a permanently
  # dangling grant. History is 1 (only the current grant is read; the revision is
  # used for conditional writes).
  kv_bucket_key_contact_grants:
    creation: true
    keep: true
    name: key-contact-grants
    replicas: 1
    history: 1
    storage: file
    maxValueSize: 65536 # 64KB — a value is two SFID/LFID-sized strings
    maxBytes: 1073741824 # 1GB
    compression: true

# consumer is the configuration for the CDC consumer Deployment.
# The consumer runs as a separate single-replica Deployment (RUN_MODE=consumer)
# using the same container image as the API. Kubernetes is the single-active
# mechanism: replicas=1 + strategy=Recreate ensures at most one pod processes
# CDC events at any time with no application-level lease needed.
consumer:
  # enabled controls whether the consumer Deployment is created.
  enabled: false
  # replicaCount must stay 1 — CDC replay-ID cursor is not sharded.
  replicaCount: 1
  # resources for the consumer pod (CDC is I/O-bound, not CPU-bound).
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  # pubsubEndpoint is the Salesforce Pub/Sub gRPC endpoint.
  # This is Salesforce's single global endpoint — the same for all orgs and
  # environments (sandbox, dev, staging, prod). Never needs a per-env override.
  pubsubEndpoint: "api.pubsub.salesforce.com:7443"
  # cdcChannel is the Salesforce CDC channel to subscribe to.
  # Use "/data/ChangeEvents" (all CDC-enabled objects) or a specific channel
  # like "/data/AccountChangeEvent" to narrow the subscription.
  # Set explicitly per environment in ArgoCD values rather than relying on
  # this default so that a future default change does not silently affect prod.
  cdcChannel: "/data/ChangeEvents"
  # quotaRefreshStaleAfter is how old the Salesforce quota observation may be
  # before the quota guard actively issues a /limits GET to refresh it (Go
  # duration string, e.g. "5m"). Leave empty to use the in-code default (5m);
  # a non-positive value disables active refresh (falls back to the passive
  # per-response header reading).
  quotaRefreshStaleAfter: ""
  # orgID is the 18-character Salesforce Org ID injected as the "tenantid"
  # gRPC metadata header for Pub/Sub API authentication. This is a public
  # tenant identifier, not a credential — set it in plain text per environment
  # in ArgoCD values. Must be overridden; the empty default disables the
  # consumer (CDCConsumerImpl calls log.Fatalf when SF_ORG_ID is empty).
  orgID: ""
  # extraEnv allows injecting additional environment variables into the
  # consumer pod (same semantics as app.extraEnv for the API pod).
  extraEnv: []

# openfga is the configuration for the OpenFGA server
openfga:
  # enabled is a boolean to determine if the OpenFGA server should be enabled for authorization
  # Note: If it is disabled, then the member service will allow all requests.
  # (Disabling OpenFGA should only be used for local development.)
  enabled: true

# heimdall is the configuration for the heimdall middleware
heimdall:
  enabled: true
  url: http://lfx-platform-heimdall.lfx.svc.cluster.local:4456
  # jwksUrl is the JWKS URL for JWT verification (note: uses port 4457)
  jwksUrl: http://lfx-platform-heimdall.lfx.svc.cluster.local:4457/.well-known/jwks
  add_middleware: false

# global is the configuration for the global settings
global:
  # awsRegion is the AWS region for the External Secrets Operator
  awsRegion: us-west-2

# serviceAccount is the configuration for the Kubernetes service account
serviceAccount:
  # create specifies whether a service account should be created
  create: true
  # name is the name of the service account to use.
  # If not set and create is true, a name is generated using the chart name
  name: "lfx-v2-member-service"
  # annotations to add to the service account (e.g. for IRSA)
  annotations: {}
  # automountServiceAccountToken determines if the service account token should be automatically mounted
  automountServiceAccountToken: true

# salesforce contains a reference to a pre-existing Kubernetes Secret holding
# Salesforce credentials. Create the secret out-of-band (e.g. via ESO, Sealed
# Secrets, or kubectl) before deploying this chart. The chart does not create or
# manage the secret itself.
salesforce:
  secrets:
    # name is the name of the Kubernetes Secret containing Salesforce credentials.
    name: lfx-v2-member-service-salesforce
    # keys maps each credential to the key name used inside the Secret.
    keys:
      instanceURL: instance_url
      clientID: client_id
      clientSecret: client_secret
      username: username
      password: password
      securityToken: security_token
      consumerRSAPem: consumer_rsa_pem
