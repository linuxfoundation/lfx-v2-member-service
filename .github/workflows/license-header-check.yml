---
# Copyright The Linux Foundation and each contributor to LFX.
# SPDX-License-Identifier: MIT
name: License Header Check

"on":
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: write

jobs:
  license-header-check:
    name: License Header Check
    uses: linuxfoundation/lfx-public-workflows/.github/workflows/license-header-check.yml@main
    with:
      copyright_line: "Copyright The Linux Foundation and each contributor to LFX."
      exclude_pattern: "gen,internal/infrastructure/salesforce/pubsub/proto,internal/infrastructure/email/templates"
